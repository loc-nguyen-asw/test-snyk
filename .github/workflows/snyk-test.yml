name: Snyk Security Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  snyk-security-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        id: snyk-scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif --json-file-output=snyk-results.json

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Parse Snyk results and log vulnerabilities
        if: always()
        run: |
          echo "=== SNYK SECURITY SCAN RESULTS ==="
          if [ -f snyk-results.json ]; then
            echo "📊 Snyk scan completed. Parsing results..."
            
            # Check if vulnerabilities were found
            VULN_COUNT=$(cat snyk-results.json | jq '.vulnerabilities | length' 2>/dev/null || echo "0")
            echo "🔍 Found $VULN_COUNT vulnerabilities"
            
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "⚠️  VULNERABILITIES DETECTED:"
              echo "=================================="
              
              # Log each vulnerability with details
              cat snyk-results.json | jq -r '.vulnerabilities[] | 
                "🔴 " + .title + 
                "\n   Package: " + .packageName + 
                "\n   Severity: " + .severity + 
                "\n   CVSS Score: " + (.cvssScore | tostring) + 
                "\n   Description: " + .description + 
                "\n   Fix: " + (.upgradePath[]? | select(. != null) | .) // "No fix available" + 
                "\n   More info: " + .url + 
                "\n   ----------------------------------------"' 2>/dev/null || echo "Error parsing vulnerability details"
              
              echo "=================================="
              echo "❌ Security scan FAILED - High severity vulnerabilities found!"
              echo "Please fix the vulnerabilities above before merging this PR."
            else
              echo "✅ No high-severity vulnerabilities found!"
            fi
          else
            echo "❌ Snyk results file not found. Scan may have failed."
          fi

          echo "=== END SNYK RESULTS ==="

      - name: Fail if vulnerabilities found
        if: always() && steps.snyk-scan.outcome == 'failure'
        run: |
          echo "🚫 BLOCKING PR: High-severity vulnerabilities detected by Snyk"
          echo "Please review and fix the security issues before merging."
          exit 1
