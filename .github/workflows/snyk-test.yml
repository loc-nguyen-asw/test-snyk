name: Snyk Security Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  snyk-security-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        id: snyk-scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif --json-file-output=snyk-results.json --exit-code=0

      - name: Generate SBOM (Software Bill of Materials)
        id: snyk-sbom
        run: |
          echo "🔍 Generating SBOM with Snyk..."
          npx snyk sbom --format=spdx-json --output=sbom.json || echo "SBOM generation failed, continuing..."
          echo "SBOM generation completed"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Convert SBOM to XML format
        if: always() && steps.snyk-sbom.outcome == 'success'
        run: |
          echo "📄 Converting SBOM to XML format..."

          # Check if jq is available
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Convert SPDX JSON to XML
          if [ -f sbom.json ]; then
            echo "Converting SPDX JSON to XML..."
            
            # Create XML header
            cat > sbom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <spdx:SpdxDocument xmlns:spdx="http://spdx.org/rdf/terms#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
            <spdx:dataLicense rdf:resource="http://spdx.org/licenses/CC0-1.0"/>
            <spdx:spdxVersion>SPDX-2.3</spdx:spdxVersion>
            <spdx:name>Software Bill of Materials - Generated by Snyk</spdx:name>
            <spdx:documentNamespace>https://github.com/${{ github.repository }}/${{ github.sha }}</spdx:documentNamespace>
            <spdx:creationInfo>
              <spdx:created>${{ github.run_id }}</spdx:created>
              <spdx:creators>
                <spdx:creator>Tool: Snyk</spdx:creator>
                <spdx:creator>Organization: ${{ github.repository_owner }}</spdx:creator>
              </spdx:creators>
            </spdx:creationInfo>
          EOF
            
            # Add packages from SPDX JSON
            jq -r '.packages[]? | 
              "  <spdx:Package rdf:about=\"#SPDXRef-" + (.SPDXID // .name | gsub("[^a-zA-Z0-9]"; "_")) + "\">" +
              "\n    <spdx:name>" + (.name // "Unknown") + "</spdx:name>" +
              "\n    <spdx:versionInfo>" + (.versionInfo // "Unknown") + "</spdx:versionInfo>" +
              "\n    <spdx:downloadLocation rdf:resource=\"NOASSERTION\"/>" +
              "\n    <spdx:filesAnalyzed>false</spdx:filesAnalyzed>" +
              "\n    <spdx:packageVerificationCode>" +
              "\n      <spdx:packageVerificationCodeValue>NOASSERTION</spdx:packageVerificationCodeValue>" +
              "\n    </spdx:packageVerificationCode>" +
              "\n    <spdx:checksums>" +
              "\n      <spdx:checksum>" +
              "\n        <spdx:algorithm rdf:resource=\"http://spdx.org/rdf/terms#checksumAlgorithm_sha1\"/>" +
              "\n        <spdx:checksumValue>NOASSERTION</spdx:checksumValue>" +
              "\n      </spdx:checksum>" +
              "\n    </spdx:checksums>" +
              "\n    <spdx:homepage rdf:resource=\"NOASSERTION\"/>" +
              "\n    <spdx:sourceInfo>NOASSERTION</spdx:sourceInfo>" +
              "\n    <spdx:licenseConcluded rdf:resource=\"http://spdx.org/licenses/NOASSERTION\"/>" +
              "\n    <spdx:licenseInfoFromFiles rdf:resource=\"http://spdx.org/licenses/NOASSERTION\"/>" +
              "\n    <spdx:licenseDeclared rdf:resource=\"http://spdx.org/licenses/NOASSERTION\"/>" +
              "\n    <spdx:licenseComments>NOASSERTION</spdx:licenseComments>" +
              "\n    <spdx:copyrightText>NOASSERTION</spdx:copyrightText>" +
              "\n    <spdx:summary>NOASSERTION</spdx:summary>" +
              "\n    <spdx:description>NOASSERTION</spdx:description>" +
              "\n    <spdx:comment>NOASSERTION</spdx:comment>" +
              "\n    <spdx:externalRefs>" +
              "\n      <spdx:externalRef>" +
              "\n        <spdx:referenceCategory rdf:resource=\"http://spdx.org/rdf/terms#referenceCategory_packageManager\"/>" +
              "\n        <spdx:referenceType rdf:resource=\"http://spdx.org/rdf/terms#referenceType_purl\"/>" +
              "\n        <spdx:referenceLocator>" + (.externalRefs[0].referenceLocator // "NOASSERTION") + "</spdx:referenceLocator>" +
              "\n      </spdx:externalRef>" +
              "\n    </spdx:externalRefs>" +
              "\n  </spdx:Package>"' sbom.json >> sbom.xml 2>/dev/null || echo "  <!-- Error parsing packages -->" >> sbom.xml
            
            # Close XML document
            echo "</spdx:SpdxDocument>" >> sbom.xml
            
            echo "✅ SBOM XML generated successfully"
            echo "📊 SBOM XML file size: $(wc -c < sbom.xml) bytes"
            echo "📋 SBOM XML preview (first 500 chars):"
            head -c 500 sbom.xml
            echo ""
            echo "=== END SBOM XML PREVIEW ==="
          else
            echo "❌ SBOM JSON file not found"
          fi

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Upload SBOM XML as artifact
        if: always() && steps.snyk-sbom.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-xml-${{ github.run_number }}
          path: sbom.xml
          retention-days: 30

      - name: Parse Snyk results and create PR comment
        if: always() && github.event_name == 'pull_request'
        id: snyk-comment
        run: |
          echo "=== SNYK SECURITY SCAN RESULTS ==="

          # Check if results file exists
          if [ ! -f snyk-results.json ]; then
            echo "❌ Snyk results file not found. Scan may have failed."
            echo "comment_file=" >> $GITHUB_OUTPUT
            echo "vuln_count=0" >> $GITHUB_OUTPUT
            echo "=== END SNYK RESULTS ==="
            exit 0
          fi

          echo "📊 Snyk scan completed. Parsing results..."

          # Check if jq is available
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Check if vulnerabilities were found
          VULN_COUNT=$(jq '.vulnerabilities | length' snyk-results.json 2>/dev/null || echo "0")
          echo "🔍 Found $VULN_COUNT vulnerabilities"

          # Debug: Show the JSON structure
          echo "📋 JSON structure:"
          jq 'keys' snyk-results.json 2>/dev/null || echo "Failed to parse JSON keys"
          echo "📋 Vulnerabilities structure:"
          jq '.vulnerabilities[0] | keys' snyk-results.json 2>/dev/null || echo "No vulnerabilities or failed to parse"
          echo "📋 Full JSON content (first 1000 chars):"
          head -c 1000 snyk-results.json
          echo ""
          echo "=== END JSON DEBUG ==="

          # Create PR comment content
          COMMENT_BODY="## 🔒 Snyk Security Scan Results

          **Scan Status:** ${{ steps.snyk-scan.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}
          **Vulnerabilities Found:** $VULN_COUNT
          **Severity Threshold:** High

          "

          if [ "$VULN_COUNT" -gt 0 ]; then
            COMMENT_BODY+="### ⚠️ High Severity Vulnerabilities Detected

            | Package | Severity | CVSS | Description | Fix Available |
            |---------|----------|------|-------------|---------------|
            "
            
            # Add each vulnerability as a table row - using correct field names from Snyk API
            jq -r '
              if .vulnerabilities and (.vulnerabilities | length) > 0 then
                .vulnerabilities[] | 
                "| " + (.moduleName // .packageName // "Unknown") + 
                " | " + (.severity // "unknown") + 
                " | " + ((.cvssScore // "N/A") | tostring) + 
                " | " + ((.title // .description // "No description") | gsub("\n"; " ") | .[0:100]) + 
                " | " + (if .fixedIn and (.fixedIn | length) > 0 then "✅ " + (.fixedIn[0]) else "❌ No fix" end) + 
                " |"
              else
                "| No vulnerabilities found | | | | |"
              end
            ' snyk-results.json > temp_comment.txt 2>/dev/null || echo "| Error parsing vulnerabilities | | | | |" > temp_comment.txt
            
            COMMENT_BODY+=$(cat temp_comment.txt 2>/dev/null || echo "")
            rm -f temp_comment.txt
            
            COMMENT_BODY+="

            ### 📋 Detailed Information
            "
            
            # Add detailed info for each vulnerability - using correct field names
            jq -r '
              if .vulnerabilities and (.vulnerabilities | length) > 0 then
                .vulnerabilities[] | 
                "#### 🔴 " + (.title // .id // "Unknown Vulnerability") + 
                "\n- **Package:** " + (.moduleName // .packageName // "Unknown") + 
                "\n- **Severity:** " + (.severity // "unknown") + 
                "\n- **CVSS Score:** " + ((.cvssScore // "N/A") | tostring) + 
                "\n- **Description:** " + (.description // .title // "No description available") + 
                "\n- **Fix:** " + (if .fixedIn and (.fixedIn | length) > 0 then .fixedIn[0] else "No fix available" end) + 
                "\n- **More Info:** " + ((.references[0].url // "No additional info")) + 
                "\n"
              else
                "No detailed vulnerability information available"
              end
            ' snyk-results.json > temp_detailed.txt 2>/dev/null || echo "Error parsing detailed vulnerability information" > temp_detailed.txt
            
            COMMENT_BODY+=$(cat temp_detailed.txt 2>/dev/null || echo "")
            rm -f temp_detailed.txt
            
            COMMENT_BODY+="

            ---
            **🚫 This PR is blocked due to high-severity security vulnerabilities.**
            Please fix the vulnerabilities above before merging this PR.
            "
          else
            COMMENT_BODY+="### ✅ No High Severity Vulnerabilities Found

            Great! No high-severity security vulnerabilities were detected in your dependencies.
            "
          fi

          # Save comment to file for GitHub API
          echo "$COMMENT_BODY" > snyk_comment.md

          # Debug: Show comment file content
          echo "📝 Comment file created:"
          echo "File size: $(wc -c < snyk_comment.md) bytes"
          echo "First 500 characters:"
          head -c 500 snyk_comment.md
          echo ""
          echo "=== END COMMENT PREVIEW ==="

          # Set output for next step
          echo "comment_file=snyk_comment.md" >> $GITHUB_OUTPUT
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT

          echo "=== END SNYK RESULTS ==="

      - name: Comment on PR with Snyk results
        if: always() && github.event_name == 'pull_request' && steps.snyk-comment.outputs.comment_file != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              console.log('Reading comment file...');
              const comment = fs.readFileSync('${{ steps.snyk-comment.outputs.comment_file }}', 'utf8');
              console.log('Comment content length:', comment.length);
              
              console.log('Creating new comment...');
              // Always create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Comment created successfully');
            } catch (error) {
              console.error('Error posting comment:', error);
              throw error;
            }

      - name: Check for vulnerabilities and fail if found
        if: always() && steps.snyk-comment.outputs.vuln_count != '' && steps.snyk-comment.outputs.vuln_count != '0'
        run: |
          echo "🚫 BLOCKING PR: High-severity vulnerabilities detected by Snyk"
          echo "Vulnerabilities found: ${{ steps.snyk-comment.outputs.vuln_count }}"
          echo "Please review and fix the security issues before merging."
          echo "Check the PR comment for detailed information."
          exit 1
