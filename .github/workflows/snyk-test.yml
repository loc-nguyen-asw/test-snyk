name: Snyk Security Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  snyk-security-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        id: snyk-scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif --json-file-output=snyk-results.json --exit-code=0

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Parse Snyk results and create PR comment
        if: always() && github.event_name == 'pull_request'
        id: snyk-comment
        run: |
          echo "=== SNYK SECURITY SCAN RESULTS ==="

          # Check if results file exists
          if [ ! -f snyk-results.json ]; then
            echo "❌ Snyk results file not found. Scan may have failed."
            echo "comment_file=" >> $GITHUB_OUTPUT
            echo "vuln_count=0" >> $GITHUB_OUTPUT
            echo "=== END SNYK RESULTS ==="
            exit 0
          fi

          echo "📊 Snyk scan completed. Parsing results..."

          # Check if jq is available
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Check if vulnerabilities were found
          VULN_COUNT=$(jq '.vulnerabilities | length' snyk-results.json 2>/dev/null || echo "0")
          echo "🔍 Found $VULN_COUNT vulnerabilities"

          # Debug: Show the JSON structure
          echo "📋 JSON structure:"
          jq 'keys' snyk-results.json 2>/dev/null || echo "Failed to parse JSON keys"
          echo "📋 Vulnerabilities structure:"
          jq '.vulnerabilities[0] | keys' snyk-results.json 2>/dev/null || echo "No vulnerabilities or failed to parse"
          echo "📋 Full JSON content (first 1000 chars):"
          head -c 1000 snyk-results.json
          echo ""
          echo "=== END JSON DEBUG ==="

          # Create PR comment content
          COMMENT_BODY="## 🔒 Snyk Security Scan Results

          **Scan Status:** ${{ steps.snyk-scan.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}
          **Vulnerabilities Found:** $VULN_COUNT
          **Severity Threshold:** High

          "

          if [ "$VULN_COUNT" -gt 0 ]; then
            COMMENT_BODY+="### ⚠️ High Severity Vulnerabilities Detected

            | Package | Severity | CVSS | Description | Fix Available |
            |---------|----------|------|-------------|---------------|
            "
            
            # Add each vulnerability as a table row - simplified parsing
            jq -r '
              if .vulnerabilities and (.vulnerabilities | length) > 0 then
                .vulnerabilities[] | 
                "| " + (.packageName // .name // .package // "Unknown") + 
                " | " + (.severity // "unknown") + 
                " | " + ((.cvssScore // .score // .cvss // "N/A") | tostring) + 
                " | " + ((.description // .title // .summary // "No description") | gsub("\n"; " ") | .[0:100]) + 
                " | " + (if .upgradePath and (.upgradePath | length) > 0 then "✅ " + (.upgradePath[]? | select(. != null) | .) else "❌ No fix" end) + 
                " |"
              else
                "| No vulnerabilities found | | | | |"
              end
            ' snyk-results.json > temp_comment.txt 2>/dev/null || echo "| Error parsing vulnerabilities | | | | |" > temp_comment.txt
            
            COMMENT_BODY+=$(cat temp_comment.txt 2>/dev/null || echo "")
            rm -f temp_comment.txt
            
            COMMENT_BODY+="

            ### 📋 Detailed Information
            "
            
            # Add detailed info for each vulnerability - simplified parsing
            jq -r '
              if .vulnerabilities and (.vulnerabilities | length) > 0 then
                .vulnerabilities[] | 
                "#### 🔴 " + (.title // .name // .id // "Unknown Vulnerability") + 
                "\n- **Package:** " + (.packageName // .name // .package // "Unknown") + 
                "\n- **Severity:** " + (.severity // "unknown") + 
                "\n- **CVSS Score:** " + ((.cvssScore // .score // .cvss // "N/A") | tostring) + 
                "\n- **Description:** " + (.description // .title // .summary // "No description available") + 
                "\n- **Fix:** " + (if .upgradePath and (.upgradePath | length) > 0 then .upgradePath[]? | select(. != null) | . else "No fix available" end) + 
                "\n- **More Info:** " + (.url // .link // "No additional info") + 
                "\n"
              else
                "No detailed vulnerability information available"
              end
            ' snyk-results.json > temp_detailed.txt 2>/dev/null || echo "Error parsing detailed vulnerability information" > temp_detailed.txt
            
            COMMENT_BODY+=$(cat temp_detailed.txt 2>/dev/null || echo "")
            rm -f temp_detailed.txt
            
            COMMENT_BODY+="

            ---
            **🚫 This PR is blocked due to high-severity security vulnerabilities.**
            Please fix the vulnerabilities above before merging this PR.
            "
          else
            COMMENT_BODY+="### ✅ No High Severity Vulnerabilities Found

            Great! No high-severity security vulnerabilities were detected in your dependencies.
            "
          fi

          # Save comment to file for GitHub API
          echo "$COMMENT_BODY" > snyk_comment.md

          # Debug: Show comment file content
          echo "📝 Comment file created:"
          echo "File size: $(wc -c < snyk_comment.md) bytes"
          echo "First 500 characters:"
          head -c 500 snyk_comment.md
          echo ""
          echo "=== END COMMENT PREVIEW ==="

          # Set output for next step
          echo "comment_file=snyk_comment.md" >> $GITHUB_OUTPUT
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT

          echo "=== END SNYK RESULTS ==="

      - name: Comment on PR with Snyk results
        if: always() && github.event_name == 'pull_request' && steps.snyk-comment.outputs.comment_file != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              console.log('Reading comment file...');
              const comment = fs.readFileSync('${{ steps.snyk-comment.outputs.comment_file }}', 'utf8');
              console.log('Comment content length:', comment.length);
              
              console.log('Creating new comment...');
              // Always create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Comment created successfully');
            } catch (error) {
              console.error('Error posting comment:', error);
              throw error;
            }

      - name: Check for vulnerabilities and fail if found
        if: always() && steps.snyk-comment.outputs.vuln_count != '' && steps.snyk-comment.outputs.vuln_count != '0'
        run: |
          echo "🚫 BLOCKING PR: High-severity vulnerabilities detected by Snyk"
          echo "Vulnerabilities found: ${{ steps.snyk-comment.outputs.vuln_count }}"
          echo "Please review and fix the security issues before merging."
          echo "Check the PR comment for detailed information."
          exit 1
